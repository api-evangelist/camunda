naftiko: 1.0.0-alpha2
info:
  label: Camunda 8 REST API — Decisions
  description: 'Camunda 8 REST API — Decisions. 2 operations. Lead operation: Search decision definitions. Self-contained
    Naftiko capability covering one Camunda business surface.'
  tags:
  - Camunda
  - Decisions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CAMUNDA_API_KEY: CAMUNDA_API_KEY
capability:
  consumes:
  - type: http
    namespace: 8-decisions
    baseUri: ''
    description: Camunda 8 REST API — Decisions business capability. Self-contained, no shared references.
    resources:
    - name: decision-definitions-search
      path: /decision-definitions/search
      operations:
      - name: searchdecisiondefinitions
        method: POST
        description: Search decision definitions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: decision-definitions-decisionKey-evaluation
      path: /decision-definitions/{decisionKey}/evaluation
      operations:
      - name: evaluatedecision
        method: POST
        description: Evaluate a decision
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: decisionKey
          in: path
          type: integer
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.CAMUNDA_API_KEY}}'
  exposes:
  - type: rest
    namespace: 8-decisions-rest
    port: 8080
    description: REST adapter for Camunda 8 REST API — Decisions. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/decision-definitions/search
      name: decision-definitions-search
      description: REST surface for decision-definitions-search.
      operations:
      - method: POST
        name: searchdecisiondefinitions
        description: Search decision definitions
        call: 8-decisions.searchdecisiondefinitions
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/decision-definitions/{decisionkey}/evaluation
      name: decision-definitions-decisionkey-evaluation
      description: REST surface for decision-definitions-decisionKey-evaluation.
      operations:
      - method: POST
        name: evaluatedecision
        description: Evaluate a decision
        call: 8-decisions.evaluatedecision
        with:
          decisionKey: rest.decisionKey
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: 8-decisions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Camunda 8 REST API — Decisions. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: search-decision-definitions
      description: Search decision definitions
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: 8-decisions.searchdecisiondefinitions
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: evaluate-decision
      description: Evaluate a decision
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: 8-decisions.evaluatedecision
      with:
        decisionKey: tools.decisionKey
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
