naftiko: 1.0.0-alpha2
info:
  label: Camunda 8 REST API — Messages
  description: 'Camunda 8 REST API — Messages. 1 operations. Lead operation: Publish a message. Self-contained Naftiko capability
    covering one Camunda business surface.'
  tags:
  - Camunda
  - Messages
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CAMUNDA_API_KEY: CAMUNDA_API_KEY
capability:
  consumes:
  - type: http
    namespace: 8-messages
    baseUri: ''
    description: Camunda 8 REST API — Messages business capability. Self-contained, no shared references.
    resources:
    - name: messages-publication
      path: /messages/publication
      operations:
      - name: publishmessage
        method: POST
        description: Publish a message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.CAMUNDA_API_KEY}}'
  exposes:
  - type: rest
    namespace: 8-messages-rest
    port: 8080
    description: REST adapter for Camunda 8 REST API — Messages. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/messages/publication
      name: messages-publication
      description: REST surface for messages-publication.
      operations:
      - method: POST
        name: publishmessage
        description: Publish a message
        call: 8-messages.publishmessage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: 8-messages-mcp
    port: 9090
    transport: http
    description: MCP adapter for Camunda 8 REST API — Messages. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: publish-message
      description: Publish a message
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: 8-messages.publishmessage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
