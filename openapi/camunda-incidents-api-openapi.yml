openapi: 3.1.0
info:
  title: Camunda 8 REST Cluster Incidents API
  description: The Camunda 8 REST API provides endpoints for managing process instances, jobs, decisions, deployments, messages, signals, and other resources in the Camunda 8 process orchestration platform.
  version: 8.6.0
  contact:
    name: Camunda
    url: https://camunda.com/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: '{baseUrl}/v2'
  description: Camunda 8 Self-Managed or SaaS
  variables:
    baseUrl:
      default: http://localhost:8080
security:
- BearerAuth: []
tags:
- name: Incidents
paths:
  /incidents/search:
    post:
      operationId: searchIncidents
      summary: Search incidents
      description: Search for incidents based on provided criteria.
      tags:
      - Incidents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Successful response
  /incidents/{incidentKey}/resolution:
    post:
      operationId: resolveIncident
      summary: Resolve an incident
      description: Resolves an incident to retry the failed operation.
      tags:
      - Incidents
      parameters:
      - name: incidentKey
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Incident resolved
components:
  schemas:
    SearchRequest:
      type: object
      properties:
        filter:
          type: object
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              order:
                type: string
                enum:
                - ASC
                - DESC
        page:
          type: object
          properties:
            from:
              type: integer
            limit:
              type: integer
            searchAfter:
              type: array
              items: {}
            searchBefore:
              type: array
              items: {}
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
