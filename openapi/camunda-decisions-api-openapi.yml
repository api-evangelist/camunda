openapi: 3.1.0
info:
  title: Camunda 8 REST Cluster Decisions API
  description: The Camunda 8 REST API provides endpoints for managing process instances, jobs, decisions, deployments, messages, signals, and other resources in the Camunda 8 process orchestration platform.
  version: 8.6.0
  contact:
    name: Camunda
    url: https://camunda.com/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: '{baseUrl}/v2'
  description: Camunda 8 Self-Managed or SaaS
  variables:
    baseUrl:
      default: http://localhost:8080
security:
- BearerAuth: []
tags:
- name: Decisions
paths:
  /decision-definitions/search:
    post:
      operationId: searchDecisionDefinitions
      summary: Search decision definitions
      description: Search for DMN decision definitions.
      tags:
      - Decisions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Successful response
  /decision-definitions/{decisionKey}/evaluation:
    post:
      operationId: evaluateDecision
      summary: Evaluate a decision
      description: Evaluates a DMN decision with the given variables.
      tags:
      - Decisions
      parameters:
      - name: decisionKey
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                variables:
                  type: object
      responses:
        '200':
          description: Successful response
components:
  schemas:
    SearchRequest:
      type: object
      properties:
        filter:
          type: object
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              order:
                type: string
                enum:
                - ASC
                - DESC
        page:
          type: object
          properties:
            from:
              type: integer
            limit:
              type: integer
            searchAfter:
              type: array
              items: {}
            searchBefore:
              type: array
              items: {}
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
